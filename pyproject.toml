[project]
name = "simplematching"
version = "0.2.0"
description = "Simple implementation of matching algorithms"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.12"
dependencies = [
    "click>=8.3.1",
    "numpy>=2.3.5",
    "pandas>=2.3.3",
]

[dependency-groups]
dev = [
    "ipykernel>=7.1.0",
    "matching>=1.4.3",
    "matplotlib>=3.10.8",
    "numpy>=2.3.5",
    "pip>=25.3",
]
